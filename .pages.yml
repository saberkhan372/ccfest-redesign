media:
- name: uploads
  label: New content images
  input: assets/uploads
  output: /assets/uploads
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  - svg
- name: legacy
  label: Existing images (keep paths)
  input: assets
  output: /assets
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  - svg
content:
- name: event
  label: Upcoming event
  type: file
  path: _data/event.yml
  icon: calendar
  fields:
  - name: name
    label: Event name
    type: string
    description: Event name. A trailing year follows the confirmed date automatically. Custom names use the existing
      display font.
    required: true
  - name: year
    label: Year
    type: number
    description: Fallback year while the date is unconfirmed; a confirmed date supplies the year everywhere.
  - name: eyebrow
    label: Small line above the title
    type: string
  - name: summary
    label: One-line summary
    type: text
  - name: date
    label: Date
    type: date
    description: Leave empty for 'To be confirmed'. Do not invent a date.
  - name: format
    label: Format
    type: string
    description: e.g. Virtual
  - name: cost
    label: Cost
    type: string
    description: e.g. Free
  - name: level
    label: Experience level
    type: string
    description: e.g. All levels
  - name: registration_url
    label: Registration link
    type: string
    description: The Luma event page, e.g. https://luma.com/…. Leave empty until registration is really open — the
      page then invites people to the mailing list instead.
  - name: luma_event_id
    label: Luma event ID
    type: string
    required: false
    description: 'Optional. Starts with evt-. In Luma: Manage event → More → Embed Registration Button. With it,
      Register opens the form on this page; without it, Register links to Luma.'
  - name: donation_note
    label: Donation note
    type: text
    required: false
    description: Shown beside the Register button once registration is open. Only mention donations if the Luma
      ticket really has a flexible amount. Leave empty to hide.
- name: keynotes
  label: Keynote speakers
  type: file
  path: _data/keynotes.yml
  icon: mic
  fields:
  - name: keynotes
    label: Keynotes
    type: object
    list: true
    description: Leave this empty until speakers are confirmed; the page shows its 'to be announced' cards by itself.
    fields:
    - name: label
      label: Label
      type: string
      description: e.g. Keynote 01
    - name: schedule_id
      label: When
      type: select
      required: false
      options:
        values:
        - opening
        - closing
      description: Which keynote block of the day this speaker is in.
    - name: name
      label: Name or talk title
      type: string
    - name: bio
      label: Bio
      type: text
      description: To link a name or organisation, write [Social Software Lab](https://sosoft.arts.ucla.edu/). Links
        open in a new tab.
    - name: short_bio
      label: Short bio (posters)
      type: text
      required: false
      description: Optional. One sentence for posters. Left empty, posters use the first sentence of the bio.
    - name: photo
      label: Photo
      type: image
      required: false
      description: Shown beside the bio, cropped to a tall frame centred on the person.
      options:
        media: legacy
        path: assets/uploads
        rename: safe
    - name: url
      label: Website
      type: string
      required: false
- name: sessions
  label: Sessions
  type: file
  path: _data/sessions.yml
  icon: list
  fields:
  - name: sessions
    label: Sessions
    type: object
    list: true
    description: Leave empty until the schedule is settled; the page shows its announcement row by itself.
    fields:
    - name: title
      label: Session title
      type: string
      description: A session only appears once it has a title.
      required: true
    - name: id
      label: ID
      type: string
      required: true
      description: Short and permanent, e.g. naoto-hieda. Visitors' saved choices and calendar entries use it, so
        never change it once the page is live.
      pattern: ^[a-z0-9][a-z0-9-]*$
    - name: format
      label: Format
      type: select
      required: true
      options:
        values:
        - Workshop
        - Panel
    - name: schedule_id
      label: When
      type: select
      required: false
      options:
        values:
        - label: Round 1 (first workshop block)
          value: round-1
        - label: Round 2 (second workshop block)
          value: round-2
        - label: Panel discussion
          value: panel
      description: Choose a block from Schedule. Leave empty for a pending workshop. Do not rename published IDs;
        update this option list if a round is added.
    - name: level
      label: Level
      type: select
      required: false
      options:
        values:
        - Beginner
        - Intermediate
        - Advanced
    - name: language
      label: Language
      type: select
      options:
        values:
        - English
        - Spanish
      description: Default English.
      default: English
    - name: tags
      label: Tags
      type: string
      list: true
      description: Optional extra topics. Level, language and Panel labels come from the dedicated fields, including
        on posters.
    - name: description
      label: Description
      type: text
      required: false
      description: Blank lines become line breaks.
    - name: short_description
      label: Short description (posters)
      type: text
      required: false
      description: Optional. One or two sentences for posters. Left empty, posters use the first sentence of the
        description.
    - name: resource_url
      label: Resources link
      type: string
      required: false
    - name: presenters
      label: Presenters
      type: object
      list: true
      description: One for a session; several for a panel (they are then labelled Panelists).
      fields:
      - name: name
        label: Name
        type: string
      - name: pronouns
        label: Pronouns
        type: string
        required: false
      - name: photo
        label: Photo
        type: image
        required: false
        description: Square, about 400px. Without one, the first letter of the name is shown.
        options:
          media: legacy
          path: assets/uploads
          rename: safe
      - name: url
        label: Website
        type: string
        required: false
      - name: bio
        label: Bio
        type: text
        required: false
        description: To link a name or organisation, write [Processing Foundation](https://processingfoundation.org).
          Links open in a new tab.
      - name: short_bio
        label: Short bio (posters)
        type: text
        required: false
        description: Optional. One sentence for posters. Left empty, posters use the first sentence of the bio.
- name: schedule
  label: Schedule
  type: file
  path: _data/schedule.yml
  icon: clock
  fields:
  - name: zones
    label: Time zone columns
    type: object
    list: true
    description: First zone owns the running-order times. IANA names derive the correct offset for the event date,
      including daylight saving.
    fields:
    - name: label
      label: Column heading
      type: string
      description: e.g. Pacific (PT)
    - name: utc_offset
      label: UTC offset in hours
      type: number
    - name: timezone
      label: IANA time zone
      type: string
      required: false
      description: e.g. America/Los_Angeles. Leave empty only for a manually verified fixed UTC offset.
  - name: items
    label: Running order
    type: object
    list: true
    description: Leave empty to hide the Schedule section.
    fields:
    - name: id
      label: ID
      type: string
      description: opening, round-1, panel, round-2 or closing. Sessions and keynotes point at these; do not rename.
      required: true
    - name: kind
      label: Kind
      type: select
      options:
        values:
        - keynote
        - workshops
        - panel
      required: true
    - name: title
      label: What's on
      type: string
      required: true
    - name: start
      label: Starts (HH:MM
      24-hour: null
      first zone): null
      type: string
      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
      required: true
    - name: end
      label: Ends (HH:MM
      24-hour: null
      first zone): null
      type: string
      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
      required: true
- name: past_events
  label: Past events
  type: file
  path: _data/past_events.yml
  icon: archive
  fields:
  - name: events
    label: Archive (newest first)
    type: object
    list: true
    fields:
    - name: datetime
      label: Machine-readable date
      type: string
      description: YYYY-MM-DD, YYYY-MM, or just the year when that is all that is known.
    - name: date_label
      label: Date as shown
      type: string
      description: e.g. Mar 21, 2026, or 2019
    - name: place
      label: Place
      type: string
      description: e.g. Virtual, or NYC · NYU ITP
    - name: url
      label: Agenda link
      type: string
      required: false
      description: Leave empty when there is no agenda to link to, and fill in the title below instead.
    - name: link_text
      label: Agenda link text
      type: string
      required: false
      description: The arrow is added for you.
    - name: title
      label: Title (when there is no link)
      type: string
      required: false
    - name: poster
      label: Poster
      type: image
      required: false
      description: Shown in the Posters grid on Past Events. About 720px wide.
      options:
        media: legacy
        path: assets/uploads
        rename: safe
    - name: poster_alt
      label: Poster description
      type: string
      required: false
      description: 'For screen readers: what the poster shows, including the date and any keynote names on it.'
    - name: poster_credit
      label: Poster designer
      type: string
      required: false
      description: Shown as 'Design by …'. Leave empty when not known.
  - name: classes
    label: Camps and classes (newest first)
    type: object
    list: true
    description: Multi-week camps and courses, listed under the archive on Past Events.
    fields:
    - name: datetime
      label: Machine-readable date
      type: string
      description: YYYY-MM-DD, or just the year.
    - name: date_label
      label: Date as shown
      type: string
      description: e.g. Fall 2024
    - name: place
      label: Place
      type: string
      description: e.g. Online
    - name: url
      label: Link
      type: string
      required: false
    - name: link_text
      label: Link text
      type: string
      required: false
      description: The arrow is added for you.
    - name: title
      label: Title (when there is no link)
      type: string
      required: false
  - name: chips
    label: Homepage location badges
    type: object
    list: true
    description: The short badges on the homepage. They summarise the archive, so several events can share one badge.
    fields:
    - name: label
      label: Place
      type: string
      description: e.g. NYC
    - name: note
      label: When
      type: string
      description: e.g. Oct 2016 · NYU ITP
- name: camps
  label: Camps and programmes
  type: file
  path: _data/camps.yml
  icon: graduation-cap
  fields:
  - name: camps
    label: Camps
    type: object
    list: true
    fields:
    - name: id
      label: Permanent camp ID
      type: string
      required: true
      description: visible-java identifies the camp page independently of its link.
    - name: name
      label: Name
      type: string
    - name: eyebrow
      label: Small line above the name
      type: string
    - name: description
      label: Description
      type: text
    - name: url
      label: Link
      type: string
      description: A page on this site relative to Events (e.g. visible-java/), or a full https:// link, which opens
        in a new tab.
    - name: link_text
      label: Link text
      type: string
      description: The arrow is added for you.
    - name: facts
      label: Facts
      type: object
      list: true
      fields:
      - name: label
        label: Label
        type: string
      - name: value
        label: Value
        type: string
- name: site
  label: Site details
  type: file
  path: _data/site.yml
  icon: settings
  fields:
  - name: email
    label: Contact email
    type: string
    description: Appears in every footer and in the mailing-list links.
  - name: tagline
    label: Footer tagline
    type: text
  - name: organizer
    label: Organizer
    type: object
    description: Shown in the footer in place of a bare email address.
    fields:
    - name: name
      label: Name
      type: string
    - name: linkedin
      label: LinkedIn URL
      type: string
      required: false
      description: Leave empty and the LinkedIn icon is not shown at all.
  - name: share_image
    label: Link preview image
    type: image
    required: false
    description: Shown when someone shares a ccfest.rocks link on LinkedIn, Bluesky, Slack, etc. 1200×630 pixels,
      important content in the middle. After changing it, refresh LinkedIn's copy at linkedin.com/post-inspector.
    options:
      media: legacy
      path: assets/uploads
      rename: safe
  - name: share_image_alt
    label: Link preview image description
    type: string
    required: false
  - name: announcement
    label: Announcement bar
    type: object
    description: The strip across the top of every page. Leave the link empty to remove it.
    fields:
    - name: eyebrow
      label: Small label
      type: string
      required: false
      description: e.g. New
    - name: text
      label: Text
      type: string
      required: false
    - name: link_text
      label: Link text
      type: string
      required: false
      description: e.g. Learn more
    - name: url
      label: Link
      type: string
      required: false
      description: A page on this site without a leading slash, e.g. events/visible-java/, or a full https:// link.
        Empty removes the bar.
  - name: mailing_list
    label: Mailing list
    type: object
    description: Leave every field empty and the site keeps the 'email us to join' flow. Fill ONE of the first two.
    fields:
    - name: embed_form_id
      label: EmailOctopus form id
      type: string
      required: false
      description: 'The id in the embed snippet: <script src=".../form/<ID>.js" data-form="<ID>">. Paste just the
        id. Empty means the page keeps the ''email us to join'' text.'
    - name: embed_host
      label: Embed host
      type: string
      required: false
      description: The host from that same snippet, e.g. eomail5.com. Take it from the snippet rather than assuming.
    - name: signup_url
      label: Hosted sign-up page (fallback)
      type: string
      required: false
      description: Shown to visitors without JavaScript, and used on its own if no form id is set.
  - name: credits
    label: Designer credits
    type: object
    list: true
    description: Francisca and Shristi asked for these on every page. Please keep them.
    fields:
    - name: role
      label: Role
      type: string
    - name: name
      label: Name
      type: string
    - name: url
      label: Website
      type: string
