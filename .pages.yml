# Pages CMS — the editing forms at app.pagescms.org.
#
# Each entry below is one form over one data file. Saving a form commits to this
# repository; GitHub Pages then rebuilds the site, usually inside a minute.
#
# WHAT IS DELIBERATELY NOT HERE
#   Layout, colour, and Francisca's lettering. The lettered headings are
#   generated from design/figma-typography.json by scripts/sync-typography.cjs,
#   and no form can reach them. See docs/TYPOGRAPHY.md.
#
# LEAVING A FIELD EMPTY IS A REAL ANSWER
#   An empty date shows "To be confirmed", an empty keynote list shows the
#   "to be announced" cards, and an empty registration link keeps the mailing
#   list invitation. Never type a placeholder to make a page look finished.

media:
  input: assets
  output: /assets

content:
  - name: event
    label: Upcoming event
    type: file
    path: _data/event.yml
    icon: calendar
    fields:
      - { name: name, label: Event name, type: string, description: "Used for the facts, the card on Events, and screen readers. The big lettered title on the page is Figma artwork and does not change with this." }
      - { name: year, label: Year, type: number, description: "Shown as 'TBC 2026' on the homepage while the date is unconfirmed." }
      - { name: eyebrow, label: Small line above the title, type: string }
      - { name: summary, label: One-line summary, type: text }
      - { name: date, label: Date, type: date, description: "Leave empty for 'To be confirmed'. Do not invent a date." }
      - { name: format, label: Format, type: string, description: "e.g. Virtual" }
      - { name: cost, label: Cost, type: string, description: "e.g. Free" }
      - { name: level, label: Experience level, type: string, description: "e.g. All levels" }
      - { name: registration_url, label: Registration link, type: string, description: "The Luma event page, e.g. https://luma.com/…. Leave empty until registration is really open — the page then invites people to the mailing list instead." }
      - { name: luma_event_id, label: Luma event ID, type: string, required: false, description: "Optional. Starts with evt-. In Luma: Manage event → More → Embed Registration Button. With it, Register opens the form on this page; without it, Register links to Luma." }
      - { name: donation_note, label: Donation note, type: text, required: false, description: "Shown beside the Register button once registration is open. Only mention donations if the Luma ticket really has a flexible amount. Leave empty to hide." }

  - name: keynotes
    label: Keynote speakers
    type: file
    path: _data/keynotes.yml
    icon: mic
    fields:
      - name: keynotes
        label: Keynotes
        type: object
        list: true
        description: "Leave this empty until speakers are confirmed; the page shows its 'to be announced' cards by itself."
        fields:
          - { name: label, label: Label, type: string, description: "e.g. Keynote 01" }
          - { name: name, label: Name or talk title, type: string }
          - { name: bio, label: Bio, type: text }
          - { name: url, label: Website, type: string, required: false }

  - name: sessions
    label: Sessions
    type: file
    path: _data/sessions.yml
    icon: list
    fields:
      - name: sessions
        label: Sessions
        type: object
        list: true
        description: "Leave empty until the schedule is settled; the page shows its announcement row by itself."
        fields:
          - { name: title, label: Session title, type: string, description: "A session only appears once it has a title." }
          - { name: tags, label: Tags, type: string, list: true, description: "Short labels, e.g. Beginner, Panel" }
          - { name: description, label: Description, type: text, required: false, description: "Blank lines become line breaks." }
          - { name: resource_url, label: Resources link, type: string, required: false }
          - name: presenters
            label: Presenters
            type: object
            list: true
            description: "One for a session; several for a panel (they are then labelled Panelists)."
            fields:
              - { name: name, label: Name, type: string }
              - { name: pronouns, label: Pronouns, type: string, required: false }
              - { name: photo, label: Photo, type: image, required: false, description: "Square, about 400px. Without one, the first letter of the name is shown." }
              - { name: url, label: Website, type: string, required: false }
              - { name: bio, label: Bio, type: text, required: false }

  - name: schedule
    label: Schedule
    type: file
    path: _data/schedule.yml
    icon: clock
    fields:
      - name: zones
        label: Time zone columns
        type: object
        list: true
        description: "The first zone is the one the times below are written in. October 17 is daylight time: Pacific -7, Eastern -4."
        fields:
          - { name: label, label: Column heading, type: string, description: "e.g. Pacific (PT)" }
          - { name: utc_offset, label: UTC offset in hours, type: number }
      - name: items
        label: Running order
        type: object
        list: true
        description: "Leave empty to hide the Schedule section."
        fields:
          - { name: title, label: What's on, type: string }
          - { name: start, label: Starts (HH:MM, 24-hour, first zone), type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
          - { name: end, label: Ends (HH:MM, 24-hour, first zone), type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }

  - name: past_events
    label: Past events
    type: file
    path: _data/past_events.yml
    icon: archive
    fields:
      - name: events
        label: Archive (newest first)
        type: object
        list: true
        fields:
          - { name: datetime, label: Machine-readable date, type: string, description: "YYYY-MM-DD, or just the year when only the year is known." }
          - { name: date_label, label: Date as shown, type: string, description: "e.g. Mar 21, 2026, or 2019" }
          - { name: place, label: Place, type: string, description: "e.g. Virtual, or NYC · NYU ITP" }
          - { name: url, label: Agenda link, type: string, required: false, description: "Leave empty when there is no agenda to link to, and fill in the title below instead." }
          - { name: link_text, label: Agenda link text, type: string, required: false, description: "The arrow is added for you." }
          - { name: title, label: Title (when there is no link), type: string, required: false }
      - name: chips
        label: Homepage location badges
        type: object
        list: true
        description: "The short badges on the homepage. They summarise the archive, so several events can share one badge."
        fields:
          - { name: label, label: Place, type: string, description: "e.g. NYC" }
          - { name: note, label: When, type: string, description: "e.g. Oct 2016 · NYU ITP" }

  - name: camps
    label: Camps and programmes
    type: file
    path: _data/camps.yml
    icon: graduation-cap
    fields:
      - name: camps
        label: Camps
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: eyebrow, label: Small line above the name, type: string }
          - { name: description, label: Description, type: text }
          - { name: url, label: Link, type: string }
          - { name: link_text, label: Link text, type: string, description: "The arrow is added for you." }
          - name: facts
            label: Facts
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: value, label: Value, type: string }

  - name: site
    label: Site details
    type: file
    path: _data/site.yml
    icon: settings
    fields:
      - { name: email, label: Contact email, type: string, description: "Appears in every footer and in the mailing-list links." }
      - { name: tagline, label: Footer tagline, type: text }
      - name: organizer
        label: Organizer
        type: object
        description: "Shown in the footer in place of a bare email address."
        fields:
          - { name: name, label: Name, type: string }
          - { name: linkedin, label: LinkedIn URL, type: string, required: false, description: "Leave empty and the LinkedIn icon is not shown at all." }
      - name: mailing_list
        label: Mailing list
        type: object
        description: "Leave every field empty and the site keeps the 'email us to join' flow. Fill ONE of the first two."
        fields:
          - { name: embed_form_id, label: "EmailOctopus form id", type: string, required: false, description: "The id in the embed snippet: <script src=\".../form/<ID>.js\" data-form=\"<ID>\">. Paste just the id. Empty means the page keeps the 'email us to join' text." }
          - { name: embed_host, label: "Embed host", type: string, required: false, description: "The host from that same snippet, e.g. eomail5.com. Take it from the snippet rather than assuming." }
          - { name: signup_url, label: "Hosted sign-up page (fallback)", type: string, required: false, description: "Shown to visitors without JavaScript, and used on its own if no form id is set." }
      - name: credits
        label: Designer credits
        type: object
        list: true
        description: "Francisca and Shristi asked for these on every page. Please keep them."
        fields:
          - { name: role, label: Role, type: string }
          - { name: name, label: Name, type: string }
          - { name: url, label: Website, type: string }
