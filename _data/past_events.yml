# Ten years of CC Fest.
#
# `events` is the archive on /past-events/, newest first. Each row needs a
# `datetime` (YYYY-MM-DD, or just the year when only the year is known) and the
# `date_label` shown on the page. Give a row either a `url` + `link_text`, or a
# `title` when there is no agenda to link to.
#
# `chips` are the short location badges on the homepage. They summarise the
# archive by place and year, so several events can share one chip.

events:
