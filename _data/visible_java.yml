classroom_directions:
- title: One idea, three environments
  description: Compare the same program as a Processing sketch, a plain Java class, and an AP-style method.
- title: Port a finished sketch
  description: Separate model from drawing code, then test the model in standard Java.
- title: Translate API boundaries
  description: Identify what Processing provides and what the student’s own Java is responsible for.
learning_outcomes:
- title: Runnable Processing sketches
  description: Small, expressive programs that make Java concepts observable and debuggable.
- title: AP-aligned translation activities
  description: Prompts that move from a sketch into standard Java methods, classes, arrays, and reasoning.
- title: Adaptable project prompts
  description: Creative constraints flexible enough for different classrooms and student interests.
- title: A clearer bridge to Java
  description: A practical way to connect visual experimentation with precise AP CSA vocabulary and expectations.
workshop_arc:
- title: From sketch to Java
  description: '`setup()`, `draw()`, variables, methods, scope, and what Processing supplies behind the scenes.'
  optional: false
- title: Logic you can see
  description: Conditionals, loops, state, input, debugging, and animations students can pause and trace.
  optional: false
- title: Objects become worlds
  description: Classes, constructors, arrays, `ArrayList`, and collections of visual objects that interact.
  optional: false
- title: From creative project to AP task
  description: Translate Processing work into standard Java, AP-style methods, testing, and written reasoning.
  optional: false
- title: Optional studio
  description: Adapt one project for your own classroom, get feedback, and share it with the group.
  optional: true
logistics_facts:
- label: Format
  value: Four live online workshops + optional studio
- label: Session length
  value: 90–120 minutes
- label: Cost
  value: Free
- label: Prerequisites
  value: Java comfort helps; no Processing experience required
- label: Technology
  value: A laptop or desktop that can run Processing and Java
- label: Dates
  value: Selected from interest-list availability
audience:
- Current and future AP Computer Science A teachers
- Creative coding educators moving from p5.js to Java
- Teachers looking for visual ways to teach abstraction and objects
- Anyone curious about connecting open-ended projects to AP CSA reasoning
