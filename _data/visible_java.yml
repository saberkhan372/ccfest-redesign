meta:
  title: 'Visible Java: Processing for AP CS A — CC Fest'
  description: 'A free CC Fest educator camp: teach AP Computer Science A through Processing, with animation, interaction,
    visual models, and student-made projects.'
interest_url: https://docs.google.com/forms/d/e/1FAIpQLSejHAD2X6rUvnoSzIv8aSlFvJc0BZT46u7sIsKbSqt2xQBo_Q/viewform
faq:
- question: Is Processing the same as p5.js?
  answer: No. They share a creative coding philosophy and similar drawing APIs, but Processing uses Java while p5.js
    uses JavaScript. This camp focuses on Java because the goal is a direct bridge to AP Computer Science A.
- question: How does this align with AP Computer Science A?
  answer: We use Processing to make variables, control flow, classes, arrays, and algorithms visible, then explicitly
    translate projects into standard Java methods, classes, tests, and AP-style written reasoning.
- question: Do I need prior Processing experience?
  answer: No. Basic Java familiarity is useful, but the first session starts with Processing’s sketch structure
    and explains what it provides behind the scenes.
- question: Is this an official College Board workshop?
  answer: No. This is an independent CC Fest educator camp designed to complement AP CSA teaching, not an official
    College Board professional development event.
- question: Are the dates final?
  answer: Not yet. The interest form will help choose a schedule that works for the first cohort.
