concept:
  eyebrow: The concept
  heading: Teach the Java students can see.
  body: Processing keeps Java’s core ideas intact while making every variable, loop, condition, and object produce
    visible behavior. That gives students a concrete way to reason about code before translating their work into
    standard AP-style Java.
  heading_2: Who this is for
  body_2: // Java that moves
