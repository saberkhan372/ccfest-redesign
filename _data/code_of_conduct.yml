contents:
  eyebrow: On this page
why:
  heading: Why do we have a code of conduct?
  body: The Code of Conduct makes space for us to deeply consider and share our goals and be open and clear about
    how we want to behave, as a community, so it’s not hidden or secret. Our goal is to make CC Fest a space where
    many different people can come together to share and learn from each other.
  body_2: We want people to come to CC Fest and participate and thrive no matter their experience, gender identity
    and expression, disability, sexual orientation, personal appearance, race, ethnicity, body size, age, nationality,
    or religion.
  body_3: 'When different people come together in a space there is huge potential for learning, collaboration, and
    real change. Unfortunately, there is also friction and conflict. This conflict emerges for many reasons including:
    historical and current racism, colonialism, sexism, ableism, transphobia, wealth inequality, and unhealed community
    and individual trauma.'
  body_4: Conflict is unavoidable. Our goal with the CoC isn’t to avoid conflict, it’s to have clearly communicated
    principles around how we deal with it. We wrote this CoC with the knowledge that the CoC will and should change,
    as we learn more and grow as a community.
who:
  heading: Who is this code of conduct for?
  body: This CoC is for everyone, including CC Fest organizers, speakers, invited guests, and attendees.
in_action:
  heading: What does this actually look like in action?
  body: When attending CC Fest sessions, we expect people to treat others with respect, to listen generously, and
    to work towards a thriving and equitable environment for all. The CoC is not about being “nice,” it’s about
    working towards an equitable environment where people from different backgrounds can come together to share
    and learn from each other.
  body_2: The CoC applies to everyone equitably. Differences in power, histories, and current realities mean that
    in order to be equitable, we need to always consider specific relationships and environments when contextualizing
    words and actions.
examples:
  heading: Specific examples
  body: Below are some examples that commonly come up. It would be impossible to write a full list here, but we
    hope these will help you get a feeling for what we expect.
  heading_2: Please do
  heading_3: Please don’t
when_things_go_wrong:
  heading: What to do when things go wrong
  body: 'If you are able and feel safe to do so, speak up in the moment: clearly name the behaviour and ask the
    person to stop.'
  body_2: You can also reach out to the event organizer and we will help you.
  eyebrow: Contact the organizer
  body_3: '[Email {organizer_name}](mailto:{contact_email}) (for any CC Fest event)'
because_of_you:
  heading: What to do when things go wrong (because of you)
  body: If you are able, apologise immediately and clearly. Avoid phrases like “I’m sorry you felt X” and instead
    use phrases like “I’m sorry I said that.” It can be hard to apologize in the moment of confrontation, but it’s
    much easier than doing it later.
  body_2: It can be tempting to talk about your intentions, but intentions aren’t important here. Of course, intentions
    do matter, but when you’ve hurt someone, the important thing isn’t what you meant to do, the important thing
    is what has happened.
  body_3: Take a break. Emotions are powerful and can lead us to say things we later regret. This can be an excellent
    moment for learning! Please don’t ask the person you just hurt! It’s an excellent opportunity to self-educate
    with books or with Google.
reports:
  heading: What happens when an incident is reported
  body: When an incident is reported, the person reporting the incident is to be treated with kindness, respect,
    and care. Safety and consent should be the priority. When you are reporting something to us, we will not ask
    you to confront anyone and we will not tell anyone who you are. We also strongly encourage you to reach out
    to your support network to discuss and decompress.
  body_2: 'The steps after an incident report will be as follows:'
  body_3: People make mistakes, and we want to foster a culture where small mistakes can be corrected. We believe
    in restorative justice, and we are interested in building systems that help everyone to thrive.
  body_4: This code of conduct was created by [Marie Claire Flanagan](https://marieflanagan.com/about/).
