meta:
  title: Code of Conduct — CC Fest
  description: 'The CC Fest Code of Conduct: how we want to behave as a community, and what to do when things go
    wrong.'
page:
  eyebrow: Community
  summary: How we want to behave as a community, openly and clearly, so it’s not hidden or secret.
  link_label: Report a concern
report_steps:
- Report received.
- If immediate action is required, the organizer ({organizer_name}) will take action. This might involve a correction,
  a discussion, or ejection from the session. In a busy, active session, sometimes things are missed. We will do
  our best to stay aware of what is happening. Please help us.
- After the session, {organizer_name} will review the incident.
- First violations will result in a warning; severe or repeat incidents will result in expulsion from CC Fest.
- After each CC Fest we will set aside a specific time to discuss the CoC and the ways we can do better.
please_dont:
- Talk over people.
- Make assumptions about people (of course, this is unavoidable, but try to minimize your assumptions).
- Romantically or sexually pursue people at CC Fest or in the context of CC Fest.
- Comment on people’s appearance if you aren’t sure how it will be received.
- Harass people. If someone doesn’t want to talk to you, let it go.
- Make dismissive, patronizing, violent, or passive-aggressive jokes or comments.
- Make jokes about pronouncing people’s names, especially if that person is already trying to speak your language.
- Diminish or underestimate structural inequities.
- Use ableist or racist language. Of course, language changes over time are cultural and complicated, but avoid
  words that “punch down” at people. If you are curious about “ableist words” or “racist words” a quick search will
  help!
- Assume that if a person makes a small mistake with their words, they are a “bad person.”
- Assume another person is more important or valuable because they are more “famous,” well-connected, or professionally
  accomplished.
- Assume that everyone else knows each other or that you are the outsider. None of us know everyone, and almost
  everyone has feelings of insecurity.
- Excuse or justify the bad behavior of others. It’s easy to feel overwhelmed in moments of conflict and say things
  that make things worse, like “I’m sure they didn’t mean that” and “maybe you’re taking this the wrong way.”
- Assume that “you are wrong” and “no one will help you” with an issue. We want to help!
please_do:
- Make space for newcomers and outsiders, and help them feel welcome even if you are a newcomer yourself!
- Speak about your lived experience and knowledge.
- Participate in a way that makes you feel good and invested.
- Honor your accessibility needs and let people know if they can help make the space better for you.
- Be aware of your own privilege and the ways you do or don’t take up space.
- Make delightful spaces for others to contribute, help other people to shine.
- Always listen generously, especially when listening to people speak in their second or third language.
- Always be learning.
- 'Use people’s pronouns (for example: she/her) correctly. If you don’t know, use their name or ask. If you make
  a mistake, apologize, correct yourself, and move on.'
- Ask questions rather than make assumptions.
- When interrupting racism, sexism, ableism, or transphobia, try to explicitly address the behavior or phrase and
  educate (rather than name-calling).
- If you have the capacity and are coming from a place of privilege, practice correcting people and being corrected
  yourself. Ideally, we take feedback as a gift. In practice, it can feel like an attack. Practice helps with this.
- Apologize quickly and concisely when you realize you’ve done something wrong. Make a sincere effort to do better
  quietly.
- Escalate any issues to the CC Fest organizer, even if the issues are with our friends or with us. We want to make
  this space suitable for you!
