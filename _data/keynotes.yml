keynotes:
  - label: Keynote
    name: Lauren Lee McCarthy
    bio: Lauren Lee McCarthy is an artist, researcher, and educator whose practice examines how technologies shape social relationships, intimacy, and everyday life. Trained in both computer science and art, McCarthy is the creator of [p5.js](https://p5js.org), the open source creative coding platform that has introduced millions of people worldwide to programming through artistic practice. She is Professor of [Design Media Arts at UCLA](https://dma.ucla.edu) and co-director, with [Casey Reas](https://reas.com), of the [Social Software Lab](https://sosoft.arts.ucla.edu/), where art is used to question and reshape our relationships with technology.
    photo: assets/people/lauren-lee-mccarthy.jpg
    url: https://get-lauren.net/
  - label: Keynote
    name: Daniel Shiffman
    bio: Daniel Shiffman is on a mission to share code with the world in an approachable, engaging way. He runs [The Coding Train](https://thecodingtrain.com/), a community for learning creative coding through beginner-friendly tutorials and coding challenges on YouTube. He is an Associate Arts Professor at [ITP, NYU Tisch School of the Arts](https://tisch.nyu.edu/itp), a co-founder of the [Processing Foundation](https://processingfoundation.org), and the author of *Learning Processing* and [*The Nature of Code*](https://natureofcode.com), an open-source book on simulating natural systems with code.
    url: https://thecodingtrain.com/
