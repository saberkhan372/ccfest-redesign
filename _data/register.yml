meta:
  title: '{event_name} — CC Fest'
  description: '{event_name} — a free gathering for creative coding workshops, talks, and community.'
join_steps:
- '**Register via Luma.** [Sign up above](#registration) to save your place.'
- '**Watch for your Zoom invite.** You will receive an invitation to the Zoom event the day before, with reminders
  in the hours before it starts.'
- '**Join the lobby.** On the day, open the Zoom event and join the lobby.'
- '**Pick a session.** There are {round_count} rounds of concurrent sessions, so drop in and out as you like. Questions
  go in the chat.'
top:
  body: Part of [Processing Community Day 2026](https://day.processing.org/).
  link_label: Register
  link_label_2: View sessions
keynotes:
  body: Speakers to be announced.
  eyebrow: Keynote 01
  heading: New perspectives.
  body_2: Speaker to be announced. Keynote speakers and their stories are on the way.
  eyebrow_2: Keynote 02
  heading_2: Shared curiosity.
  body_3: Speaker to be announced. Join the mailing list to hear who’s speaking.
sessions:
  body: Times TBA
  eyebrow: Presenters
  heading: A little code. A lot of possibility.
  body_2: Explore creative tools, make something new, and learn alongside the community. Session times, presenters,
    and workshop details will appear here once confirmed.
  heading_2: My choices
  body_3: Workshops in a round run at the same time. On each one, mark a first choice, a second choice (one of each
    per round) and any number of maybes. Your choices stay in this browser.
  body_4: 'The file works with Apple Calendar, Outlook and Google Calendar (Settings → Import). It includes the
    keynotes, the panel and your first choice in each round (second choices and maybes are not added), and is a
    snapshot: if the schedule changes later, download it again. The PDF and PNG are printable copies of your choices,
    with times in the zone chosen above.'
pending:
  heading: Round to be announced
  body: These workshops are confirmed; their round will be added here soon.
