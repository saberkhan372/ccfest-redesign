how_to_join:
  heading: How to join on the day
  body: 'Virtual CC Fest runs on Zoom Events: one lobby, with several workshops happening at once in each round.'
  body_2: Stuck? Email [{contact_email}](mailto:{contact_email}?subject=Joining%20CC%20Fest) and we’ll help you
    get in.
