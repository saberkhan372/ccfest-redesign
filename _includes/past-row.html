<li class="past-row"><time datetime="{{ include.event.datetime }}">{{ include.event.date_label }}</time><span class="past-place">{{ include.event.place }}</span>{% assign url = include.event.url | default: "" | strip %}{% if url != "" %}<a href="{{ include.event.url }}" target="_blank" rel="noopener">{{ include.event.link_text }} ↗</a>{% else %}<span class="past-title">{{ include.event.title }}</span>{% endif %}</li>
