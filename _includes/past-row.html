<li class="past-row"><time datetime="{{ include.event.datetime | escape }}">{{ include.event.date_label | escape }}</time><span class="past-place">{{ include.event.place | escape }}</span>{% assign url = include.event.url | default: "" | strip %}{% if url != "" %}<a href="{{ include.event.url | escape }}" target="_blank" rel="noopener">{{ include.event.link_text | escape }} ↗</a>{% else %}<span class="past-title">{{ include.event.title | escape }}</span>{% endif %}</li>
